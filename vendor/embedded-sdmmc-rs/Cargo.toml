[package]
authors = ["Jonathan 'theJPster' Pallant <github@thejpster.org.uk>", "Rust Embedded Community Developers"]
categories = ["embedded", "no-std"]
description = "A basic SD/MMC driver for Embedded Rust."
edition = "2024"
keywords = ["sdcard", "mmc", "embedded", "fat32"]
license = "MIT OR Apache-2.0"
name = "embedded-sdmmc"
readme = "README.md"
repository = "https://github.com/rust-embedded-community/embedded-sdmmc-rs"
version = "0.9.0"

# Make sure to update the CI too!
rust-version = "1.87"

[dependencies]
byteorder = {version = "1", default-features = false}
defmt = {version = "1.0.1", optional = true}
embedded-hal = "1.0.0"
embedded-hal-async = {version = "1.0.0", optional = true}
embedded-io = "0.7"
embedded-io-async = {version = "0.7", optional = true}
bitbybit = "2"
arbitrary-int = "2"
bitflags = "2"
heapless = "0.9.1"
log = {version = "0.4", default-features = false, optional = true}
thiserror = {version="2", default-features = false}

[features]
default = ["log"]
async = ["dep:embedded-hal-async", "dep:embedded-io-async"]
defmt-log = ["dep:defmt", "arbitrary-int/defmt"]
log = ["dep:log"]
