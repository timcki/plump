[package]
name = "smol-epub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Hans Martin <https://github.com/hansmrtn>"]
description = "Minimal no_std EPUB parser with streaming decompression, HTML stripping, and optional 1-bit image decoders"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hansmrtn/smol-epub"
keywords = ["epub", "no_std", "embedded", "e-ink", "ebook"]
categories = ["no-std", "parser-implementations", "embedded"]
readme = "README.md"

[dependencies]
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
log = "0.4"
# dictionary hyphenation (Typst's Liang tries); languages are picked
# here so the pattern data stays bounded on flash-sized targets
hypher = { version = "0.1", optional = true, default-features = false, features = ["english", "polish"] }

[dev-dependencies]
env_logger = "0.11"

[features]
default = ["images"]
images = []
async = []
hyphenation = ["dep:hypher"]
